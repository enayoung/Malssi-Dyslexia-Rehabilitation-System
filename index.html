<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>씨앗의 말 정원</title>
  <meta name="description" content="언어를 잃은 세상의 아기 씨앗에게 소리와 글을 알려주는 읽기·쓰기 놀이">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-home" aria-label="정원으로">🏡</button>
    <div class="growth">
      <div class="growth-label"><span id="seed-name">씨앗</span> · <span id="stage-name">아기 씨앗</span></div>
      <div class="growth-bar" role="progressbar" aria-label="씨앗 성장"><div id="growth-fill"></div></div>
    </div>
    <button class="icon-btn" id="btn-mode" aria-label="입력 방식 바꾸기">🎤</button>
    <button class="icon-btn" id="btn-text" aria-label="글자 크게">가+</button>
  </header>

  <section class="scene" id="scene">
    <div class="garden" id="garden" aria-label="씨앗의 정원"></div>
    <div class="seed-wrap">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <svg id="seed" viewBox="0 0 200 200" aria-hidden="true"></svg>
      <div class="bloom-layer" id="bloom-layer"></div>
    </div>
  </section>

  <main class="panel" id="panel"></main>

  <div class="overlay hidden" id="overlay"></div>

  <script src="js/hangul.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
